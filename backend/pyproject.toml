[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
# Paralelo (pytest-xdist): um banco de teste por worker. Use -n 0 para depurar.
addopts = "-n 8"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",
    "src/manage.py",
    "src/config/wsgi.py",
    "src/config/asgi.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.isort]
known-first-party = [
    "config", "core", "conectores", "rubricas", "lotes", "avaliacao",
    "revisao", "estudos", "metricas", "tests",
]
